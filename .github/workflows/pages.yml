name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # refresh the GitHub project list daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # build and deploy are separate jobs (GitHub's standard Pages layout): deploy-pages looks the artifact up
  # by name, and in one job it sometimes ran before the upload was visible ("No artifacts named github-pages")
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # If GitHub's API is down, deploy with the committed list rather than failing.
      - run: node scripts/fetch-repos.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
